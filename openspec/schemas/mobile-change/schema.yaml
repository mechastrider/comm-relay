name: mobile-change
version: 1
description: Mobile application workflow - behavior, screens/navigation, offline sync, permissions, platform matrix, release, QA, and tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why the mobile change is needed and which users/platforms it affects
    template: proposal.md
    instruction: |
      Explain user problem, capabilities, scope/non-goals, iOS/Android impact,
      offline/lifecycle/privacy implications, compatibility, and release impact.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Observable mobile behavior contracts
    template: spec.md
    instruction: |
      Specify user-visible behavior, lifecycle/background/offline behavior,
      permissions and recovery with SHALL/MUST scenarios. Capture normative
      platform differences without leaking implementation details.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Architecture, state, lifecycle, sync, security, and rollout decisions
    template: design.md
    instruction: |
      Explain component/state flow, native/shared boundary, lifecycle/background
      constraints, concurrency/cancellation, security/privacy, alternatives,
      risks, migration/rollout/rollback, and blocking questions.
    requires: [proposal]
  - id: screen_contract
    generates: screen_contract.md
    description: Screens, navigation, deep links, states, forms, accessibility, and device adaptation
    template: screen_contract.md
    instruction: |
      Capture changed screens, navigation/back behavior, tabs/modals, deep links,
      data/actions/forms, loading/empty/error/offline/stale/permission states,
      accessibility, orientation/window size, keyboard/safe areas, design-system
      components, and non-goals. If UI does not change, record Not applicable.
    requires: [proposal, specs, design]
  - id: data_sync
    generates: data_sync.md
    description: Local state, cache, offline queue, synchronization, conflict, and migration contract
    template: data_sync.md
    instruction: |
      Define source of truth, local stores/schema, caching, offline reads/writes,
      queue/retry/idempotency/order, conflict resolution, connectivity changes,
      background constraints, auth expiry, migrations, corruption/recovery,
      cleanup, privacy, and observability. Record Not applicable when unchanged.
    requires: [proposal, specs, design]
  - id: permissions
    generates: permissions.md
    description: Runtime permissions, privacy declarations, denial/revocation, and fallback UX
    template: permissions.md
    instruction: |
      Inventory each permission/sensitive capability by platform, trigger,
      rationale copy, data usage, OS manifest/privacy declaration, denial,
      permanent denial/settings route, revocation, least privilege, and test
      cases. If none change, record Not applicable.
    requires: [proposal, specs, screen_contract, data_sync]
  - id: platform_matrix
    generates: platform_matrix.md
    description: iOS/Android version, device, form-factor, lifecycle, and capability differences
    template: platform_matrix.md
    instruction: |
      Define supported OS/device/form-factor matrix, platform-specific behavior,
      lifecycle/background limits, input/accessibility, hardware/deep-link/push
      variations, minimum versions, feature availability, and explicit skips.
    requires: [specs, screen_contract, data_sync, permissions]
  - id: release_plan
    generates: release_plan.md
    description: Build variants, signing, store metadata, staged rollout, upgrade, and rollback plan
    template: release_plan.md
    instruction: |
      Plan version/build numbers, variants/flavors, signing authority boundary,
      store/privacy metadata, migrations, min OS, backward compatibility,
      staged rollout/feature flags, monitoring, rollback/kill switch, release
      notes, and build/archive smoke. Planning does not authorize signing,
      upload, or store submission. Record Not applicable for unreleased apps.
    requires: [design, data_sync, permissions, platform_matrix]
  - id: qa_plan
    generates: qa_plan.md
    description: Device/OS, lifecycle, offline, permission, accessibility, upgrade, and release QA
    template: qa_plan.md
    instruction: |
      Map specs/contracts to unit/integration/UI/device/manual checks. Cover
      supported device/OS matrix, orientation/window size, accessibility/input,
      lifecycle/background/termination, offline/reconnect/conflicts, permission
      grant/deny/revoke, deep links/push where applicable, migration/upgrade,
      performance/battery/network, fixtures, priority, commands, and evidence.
    requires: [specs, screen_contract, data_sync, permissions, platform_matrix, release_plan]
  - id: tasks
    generates: tasks.md
    description: Broad semantic mobile slices plus QA/review/release-readiness gates
    template: tasks.md
    instruction: |
      Group shared/native logic, screens, sync, permissions, tests and build
      fallout by coherent user outcome. Do not split jobs per screen layer or
      platform when one contract can be accepted together. Split a platform
      only for a genuine independent boundary. Include QA, fresh review and
      release readiness without publishing.
    requires: [specs, design, screen_contract, data_sync, permissions, platform_matrix, release_plan, qa_plan]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Implement semantic slices, execute qa_plan on the supported device/OS
    matrix, obtain a fresh review, and verify release readiness without signing
    or submitting. Pause on permission/privacy, data migration, lifecycle, or
    compatibility ambiguity.
