name: service-change
version: 1
description: Service workflow - proposal, specs, design, interface drafts, data schema, integrations, operations, QA, and tasks
artifacts:
  - id: proposal
    generates: proposal.md
    description: Why the service change is needed and its system impact
    template: proposal.md
    instruction: |
      Explain problem, scope/non-goals, capabilities, affected consumers and
      systems, reliability/security impact, and breaking changes.
    requires: []
  - id: specs
    generates: "specs/**/*.md"
    description: Observable service behavior contracts
    template: spec.md
    instruction: |
      Specify API/event/job behavior, errors, authorization/isolation,
      reliability and compatibility with SHALL/MUST scenarios. Preserve complete
      MODIFIED requirements.
    requires: [proposal]
  - id: design
    generates: design.md
    description: Architecture, lifecycle, migration, and trade-off decisions
    template: design.md
    instruction: |
      Explain approach, alternatives, component/data flow, consistency,
      concurrency, failure/retry/cancellation, security, migration/rollout,
      observability, risks, and blocking questions.
    requires: [proposal]
  - id: api_drafts
    generates: api_drafts.md
    description: HTTP, RPC, event, queue, CLI, or worker boundary contracts
    template: api_drafts.md
    instruction: |
      Describe every new/changed boundary using project conventions. Include
      schemas/examples, errors, auth/isolation, idempotency, ordering,
      pagination/streaming, retries, versioning, and compatibility as relevant.
      If no external/application boundary changes, record Not applicable.
    requires: [proposal, specs]
  - id: db_schema
    generates: db_schema.md
    description: Persistent schema and migration contract
    template: db_schema.md
    instruction: |
      Describe persistent structures, constraints, indexes, ownership/isolation,
      migration/backfill, mixed-version compatibility, rollback/forward-fix, and
      verification using actual engine conventions. If unchanged, record Not
      applicable.
    requires: [proposal, specs, design]
  - id: integration_contracts
    generates: integration_contracts.md
    description: External systems, events, credentials, retries, and failure boundaries
    template: integration_contracts.md
    instruction: |
      Define dependencies and ownership, request/event formats, auth/secrets,
      timeout/retry/idempotency/order, rate limits, partial failure, sandbox/test
      doubles, observability, and compatibility. If none change, record Not
      applicable.
    requires: [proposal, specs, design, api_drafts]
  - id: operations_plan
    generates: operations_plan.md
    description: Deployment, migration, observability, capacity, and rollback plan
    template: operations_plan.md
    instruction: |
      Plan deploy order, config/secrets, migration/backfill, feature flags,
      metrics/logs/traces/alerts, capacity/performance, health, rollback and
      incident recovery. Planning never authorizes deployment. If operational
      behavior is unaffected, record Not applicable.
    requires: [design, db_schema, integration_contracts]
  - id: qa_plan
    generates: qa_plan.md
    description: Risk-based unit, integration, contract, migration, and operational QA
    template: qa_plan.md
    instruction: |
      Map specs/contracts/operations to focused and broad checks. Cover negative
      auth/isolation, migration/rollback, dependency failure, retry/idempotency,
      concurrency, performance and observability where applicable. Define
      environment, fixtures, commands, priorities, and evidence.
    requires: [specs, api_drafts, db_schema, integration_contracts, operations_plan]
  - id: tasks
    generates: tasks.md
    description: Broad semantic slices plus QA and review gates
    template: tasks.md
    instruction: |
      Group domain, persistence, boundary, tests, fixtures and operational
      fallout by coherent behavior. Do not create jobs per layer/artifact.
      Include acceptance, areas/autonomy, guardrails, QA and fresh review.
    requires: [specs, design, api_drafts, db_schema, integration_contracts, operations_plan, qa_plan]
apply:
  requires: [tasks]
  tracks: tasks.md
  instruction: |
    Implement semantic slices, run acceptance and qa_plan, then obtain a fresh
    review. Pause on contract conflicts, migration risk without rollback, or
    blocking questions. Do not deploy from this workflow without authority.
