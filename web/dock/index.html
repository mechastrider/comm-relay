<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>CommRelay Messages</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/shared/reward-picker.css?v=2">
    <link rel="stylesheet" href="/shared/tooltip.css?v=21">
    <link rel="stylesheet" href="/dock/messages/messages.css?v=13">
    <script>
      (function () {
        try {
          var locale = localStorage.getItem("commRelay.uiLocale");
          if (locale === "en-GB") {
            document.documentElement.lang = "en";
          } else if (locale === "ru-RU") {
            document.documentElement.lang = "ru";
          }
        } catch (_err) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <main id="message-panel" class="message-panel">
      <ol id="messages" class="message-list" aria-live="polite" aria-relevant="additions"></ol>
      <p id="empty-state" class="empty-state">Waiting for chat messages</p>
    </main>
    <script type="module" src="/dock/messages/messages.js?v=16"></script>
  </body>
</html>
