<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <title>CommRelay Messages</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/shared/reward-picker.css?v=2">
    <link rel="stylesheet" href="/shared/tooltip.css?v=21">
    <link rel="stylesheet" href="/dock/messages/messages.css?v=20">
    <script>
      (function () {
        try {
          var locale = localStorage.getItem("commRelay.uiLocale");
          if (locale === "en-GB") {
            document.documentElement.lang = "en";
          } else if (locale === "ru-RU") {
            document.documentElement.lang = "ru";
          }
        } catch (_err) { /* ignore */ }
      })();
    </script>
  </head>
  <body>
    <div class="dock-shell">
      <header class="leaderboard-toolbar" aria-labelledby="leaderboard-toolbar-title">
        <div class="leaderboard-toolbar__topline">
          <strong id="leaderboard-toolbar-title" data-i18n="dock.leaderboard">Leaderboard</strong>
          <span class="leaderboard-toolbar__state">
            <span id="leaderboard-visibility-status" class="leaderboard-toolbar__status" role="status" aria-live="polite"></span>
            <span id="leaderboard-visibility-countdown" class="leaderboard-toolbar__countdown" role="timer" aria-live="off"></span>
          </span>
        </div>
        <label class="leaderboard-toolbar__preset">
          <span data-i18n="dock.preset">Preset</span>
          <select id="leaderboard-preset" aria-label="Preset"></select>
        </label>
        <div class="leaderboard-toolbar__control-row">
          <div id="leaderboard-always-actions" class="leaderboard-toolbar__always-actions" hidden>
            <label class="leaderboard-toolbar__switch">
              <input id="leaderboard-always-visible" type="checkbox" role="switch">
              <span data-i18n="dock.alwaysVisible">Show leaderboard</span>
            </label>
          </div>
          <div id="leaderboard-timed-actions" class="leaderboard-toolbar__actions">
            <button id="leaderboard-show" class="leaderboard-toolbar__icon-button has-tooltip" type="button" data-leaderboard-action="show" aria-label="Show for 15s">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 7v5l3 2"></path></svg>
              <span id="leaderboard-show-label" class="ui-tooltip" role="tooltip">Show for 15s</span>
            </button>
            <button id="leaderboard-pin" class="leaderboard-toolbar__icon-button has-tooltip" type="button" data-leaderboard-action="pin" aria-label="Pin" aria-pressed="false">
              <svg class="leaderboard-toolbar__pin-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m8 3 8 8M14 5l5 5-4 2-3 5-2-4-4-4 5-3 3-1ZM6 15l-3 6 6-3"></path></svg>
              <svg class="leaderboard-toolbar__resume-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7v5h5"></path><path d="M6.5 16.5A7 7 0 1 0 5 10"></path></svg>
              <span id="leaderboard-pin-label" class="ui-tooltip" role="tooltip">Pin</span>
            </button>
            <button id="leaderboard-hide" class="leaderboard-toolbar__icon-button has-tooltip" type="button" data-leaderboard-action="hide" aria-label="Hide" data-i18n-aria-label="dock.hide">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"></path><path d="M10.6 10.7a2 2 0 0 0 2.7 2.7M9.9 4.2A10.7 10.7 0 0 1 21 12a12.5 12.5 0 0 1-2.1 3.1M6.6 6.6A12.4 12.4 0 0 0 3 12s3.3 6 9 6a8.8 8.8 0 0 0 3-.5"></path></svg>
              <span class="ui-tooltip" role="tooltip" data-i18n="dock.hide">Hide</span>
            </button>
          </div>
          <div id="contract-presentation-actions" class="leaderboard-toolbar__actions leaderboard-toolbar__contract-actions" hidden>
            <div class="leaderboard-toolbar__mode-switcher" role="group" aria-label="Displayed content" data-i18n-aria-label="dock.contractMode">
              <button id="contract-show-objective" class="leaderboard-toolbar__icon-button has-tooltip" type="button" aria-label="Show contract objective" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"></circle><path d="M12 2v4M12 18v4M2 12h4M18 12h4"></path></svg>
                <span class="ui-tooltip" role="tooltip" data-i18n="dock.contractObjective">Show contract objective</span>
              </button>
              <button id="contract-show-leaderboard" class="leaderboard-toolbar__icon-button has-tooltip" type="button" aria-label="Show leaderboard" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 20v-7M12 20V4M19 20v-11"></path></svg>
                <span class="ui-tooltip" role="tooltip" data-i18n="dock.contractLeaderboard">Show leaderboard</span>
              </button>
            </div>
            <button id="contract-repeat-announcement" class="leaderboard-toolbar__icon-button has-tooltip" type="button" aria-label="Repeat announcement">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2.3 5.7M4 11V5m0 6h6"></path></svg>
              <span class="ui-tooltip" role="tooltip" data-i18n="dock.contractRepeat">Repeat announcement</span>
            </button>
          </div>
        </div>
        <p id="leaderboard-toolbar-error" class="leaderboard-toolbar__error" role="alert" hidden></p>
      </header>
      <main id="message-panel" class="message-panel">
        <ol id="messages" class="message-list" aria-live="polite" aria-relevant="additions"></ol>
        <p id="empty-state" class="empty-state">Waiting for chat messages</p>
      </main>
    </div>
    <script type="module" src="/dock/messages/messages.js?v=23"></script>
  </body>
</html>
