# golangci-lint v2 — https://golangci-lint.run/docs/configuration/
version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - errorlint
    - misspell
    - revive
  settings:
    depguard:
      rules:
        errors:
          deny:
            - pkg: github.com/pkg/errors
              desc: use github.com/muonsoft/errors
    govet:
      enable-all: true
      disable:
        - fieldalignment
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
        - name: increment-decrement
        - name: var-naming
        - name: var-declaration
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
        - name: unused-parameter
          disabled: true
    errorlint:
      errorf: true
      asserts: true
      comparison: true

  exclusions:
    rules:
      - path: _test\.go
        linters:
          - revive
        text: dot-imports

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mechastrider/comm-relay

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
