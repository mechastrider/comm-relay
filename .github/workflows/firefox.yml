name: Firefox regression

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:
    inputs:
      matrix:
        description: Firefox coverage (full excludes visual snapshots)
        type: choice
        options:
          - targeted
          - full
        default: targeted

permissions:
  contents: read

jobs:
  firefox:
    name: Firefox regression
    runs-on: ubuntu-22.04
    env:
      COMM_RELAY_E2E_MATRIX: ${{ inputs.matrix || 'targeted' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npx playwright install --with-deps firefox
      - name: Start virtual audio output
        # Firefox needs an audio backend for real AudioContext/media playback.
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl list short sinks
      - run: npm run test:e2e -- --project=firefox
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-firefox
          path: playwright-report/
          retention-days: 14
