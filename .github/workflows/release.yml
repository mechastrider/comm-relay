name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

env:
  WAILS_VERSION: v2.12.0
  WAILS_PROJECT_DIR: cmd/comm-relay-desktop
  WAILS_BIN_DIR: cmd/comm-relay-desktop/build/bin

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changelog_version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Check changelog is ready for release
        shell: bash
        run: |
          bash scripts/prepare-changelog.sh "${{ steps.version.outputs.changelog_version }}" --check-only

  build:
    name: Build ${{ matrix.name }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows 11 64-bit
            runner: windows-latest
            platform: windows/amd64
            artifact: commrelay-windows-amd64
          - name: macOS universal 64-bit
            runner: macos-latest
            platform: darwin/universal
            artifact: commrelay-macos-universal
          - name: Linux 64-bit
            runner: ubuntu-24.04
            platform: linux/amd64
            artifact: commrelay-linux-amd64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@${{ env.WAILS_VERSION }}

      - name: Build desktop app
        shell: bash
        run: |
          cd "$WAILS_PROJECT_DIR"
          wails build -clean -platform "${{ matrix.platform }}"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $binDir = $env:WAILS_BIN_DIR
          $exePath = Join-Path $binDir "comm-relay-desktop.exe"
          if (-not (Test-Path $exePath)) {
            Write-Error "Windows binary not found at $exePath"
            Get-ChildItem -Recurse $binDir
            exit 1
          }

          $packageDir = "dist/CommRelay-$version-windows-amd64"
          New-Item -ItemType Directory -Path $packageDir -Force | Out-Null
          Copy-Item $exePath "$packageDir/CommRelay.exe"
          Copy-Item "README.md", "CHANGELOG.md", "LICENSE" $packageDir
          Compress-Archive -Path $packageDir -DestinationPath "dist/CommRelay-$version-windows-amd64.zip" -Force

      - name: Package macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package_dir="dist/CommRelay-$version-macos-universal"
          bin_dir="$WAILS_BIN_DIR"
          mkdir -p "$package_dir"

          app_path="$(find "$bin_dir" -maxdepth 1 -name '*.app' -print -quit)"
          if [ -z "$app_path" ]; then
            echo "No .app bundle found in $bin_dir" >&2
            ls -la "$bin_dir" || true
            exit 1
          fi

          cp -R "$app_path" "$package_dir/"
          cp README.md CHANGELOG.md LICENSE "$package_dir/"
          ditto -c -k --sequesterRsrc --keepParent "$package_dir" "dist/CommRelay-$version-macos-universal.zip"

      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          package_dir="dist/CommRelay-$version-linux-amd64"
          bin_dir="$WAILS_BIN_DIR"
          mkdir -p "$package_dir"

          bin_path="$(find "$bin_dir" -maxdepth 1 -type f -name 'comm-relay-desktop*' ! -name '*.app' -print -quit)"
          if [ -z "$bin_path" ]; then
            echo "No Linux binary found in $bin_dir" >&2
            ls -la "$bin_dir" || true
            exit 1
          fi

          cp "$bin_path" "$package_dir/CommRelay"
          chmod +x "$package_dir/CommRelay"
          cp "$WAILS_PROJECT_DIR/build/appicon.png" "$package_dir/comm-relay.png"
          cp "$WAILS_PROJECT_DIR/packaging/linux/CommRelay.desktop" "$package_dir/CommRelay.desktop"
          cp "$WAILS_PROJECT_DIR/packaging/linux/install-desktop.sh" "$package_dir/install-desktop.sh"
          chmod +x "$package_dir/install-desktop.sh"
          cp README.md CHANGELOG.md LICENSE "$package_dir/"
          tar -C dist -czf "dist/CommRelay-$version-linux-amd64.tar.gz" "$(basename "$package_dir")"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi

          if [[ ! "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "changelog_version=${version#v}" >> "$GITHUB_OUTPUT"

      - name: Promote changelog on main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git checkout main
          git pull --ff-only origin main

          bash scripts/prepare-changelog.sh "${{ steps.version.outputs.changelog_version }}"

          if git diff --quiet -- CHANGELOG.md; then
            echo "CHANGELOG.md already contains release section"
            exit 0
          fi

          git add CHANGELOG.md
          git commit -m "chore(release): prepare CHANGELOG for ${{ steps.version.outputs.version }}"
          git push origin main

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Extract release notes
        shell: bash
        run: |
          version="${{ steps.version.outputs.changelog_version }}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md

          if [ ! -s release-notes.md ]; then
            echo "CommRelay ${{ steps.version.outputs.version }}" > release-notes.md
            echo "" >> release-notes.md
            echo "See CHANGELOG.md for details." >> release-notes.md
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: CommRelay ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: dist/*
          prerelease: ${{ contains(steps.version.outputs.version, '-') }}
