name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build React admin
        run: npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      - name: Test
        run: go test ./... -race -count=1

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Build React admin
        run: npm ci && npm run build

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: TypeScript
        run: npm run typecheck

      - name: Frontend tests
        run: npm test

      - name: ESLint (web)
        run: npm run lint

  browser:
    name: Browser regression
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - name: Start virtual audio output
        # Keep real AudioContext/media playback backed by a virtual audio device.
        run: |
          sudo apt-get install -y pulseaudio
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=ci_audio
          pactl set-default-sink ci_audio
          pactl list short sinks
      - run: npm run test:e2e -- --project=chromium --project=webkit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
